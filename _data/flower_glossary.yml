# 한국춘란 화예 용어사전 v0.2
# 목적: K-Chunran 내부에서 보존·관리하는 한국춘란 화예 용어 사전.
# 원칙:
# - 사전의 정의와 용어 정보는 이 저장소 안에 독립적으로 보존한다.
# - 외부 웹페이지에 접속해야만 사전 내용을 확인할 수 있는 구조로 만들지 않는다.
# - 외부 자료는 검증 과정의 참고 출처로만 기록하며, 사전 본문은 외부 링크에 의존하지 않는다.
# - 공식 표준으로 확인되지 않은 정의나 분류 경계는 임의로 확정하지 않고 needs_review로 남긴다.
# - 꽃의 기관, 화예 형질, 재배·관리 용어를 서로 다른 영역으로 구분한다.
# - 특히 소심은 꽃색과 동일한 축으로 취급하지 않고 설판/설점 형질과 연결한다.

version: "0.2"
title: "한국춘란 화예 용어사전"
scope: "한국춘란의 꽃 기관, 화색, 설판, 화형, 꽃무늬 및 관찰 형질"
status: "working_glossary"

# 출처는 검증 이력 보존용이다.
# URL은 저장하지 않는다. 사전 자체가 외부 사이트에 의존하지 않도록 한다.
sources:
  - id: source_01
    title: "우리나라 춘란의 용어"
    source_type: "community_reference"
    verification_level: "secondary"
    note: "꽃 기관과 난 관련 용어의 정의를 확인한 참고 자료"

  - id: source_02
    title: "춘란 키우기 동/서양란 키우기"
    source_type: "community_reference"
    verification_level: "secondary"
    note: "화예품 분류 및 봉심·설판·설점 관련 설명을 확인한 참고 자료"

  - id: source_03
    title: "동양란 종류 동/서양란 키우기"
    source_type: "community_reference"
    verification_level: "secondary"
    note: "화색 및 꽃잎 형태 분류 설명을 확인한 참고 자료"

  - id: source_04
    title: "한국춘란 화예 등록품"
    source_type: "registration_list_reference"
    verification_level: "secondary"
    note: "실제 등록품에서 사용된 화예 분류 명칭을 확인한 참고 자료"

  - id: source_05
    title: "춘란 등록품 243점(2004-2006년)"
    source_type: "registration_list_reference"
    verification_level: "secondary"
    note: "등록품의 화예 분류 명칭 사용례를 확인한 참고 자료"

categories:
  flower_organ: "꽃의 각부"
  flower_color: "화색"
  seolpan: "설판·설점"
  flower_form: "화형"
  flower_pattern: "꽃무늬"
  flower_variation: "화형·구조 변이"
  flower_observation: "꽃의 관찰 형질"
  cultivation_management: "재배·관리"


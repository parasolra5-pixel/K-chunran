# 한국춘란 분류 표준 v1
#
# 원칙:
# - 품종의 대표 분류명과 세부 형질을 분리한다.
# - 품종 분류는 도감 화면에서 대표 명칭 하나만 표시한다.
# - 세부 형질은 AI 데이터셋을 위해 독립된 축으로 보존한다.
# - 대표 분류명을 세부 형질의 하위값으로 만들지 않는다.
# - 시장 정보는 식물학적·형태학적 정보와 분리한다.

# --------------------------------------------------
# 품종 분류
# --------------------------------------------------
# 사람이 도감에서 보는 대표 분류명.
# 한 품종에는 대표 분류명 하나를 지정한다.
#
cultivar_class:
  jungtuho: "중투호"
  danyeopseong_jungtu: "단엽성중투"
  danyeop_jungtu: "단엽중투"
  danyeop_bokryun: "단엽복륜"

# --------------------------------------------------
# 세부 형질
# --------------------------------------------------

# 잎의 형태
leaf_form:
  danyeop: "단엽"
  hwanyeop: "환엽"

# 잎의 폭
leaf_width:
  gwangyeop: "광엽"
  seyeop: "세엽"

# 잎의 표면·질감
# 현재 확인된 용어만 우선 기록한다.
leaf_texture:
  nasaji: "나사지"

# 잎의 자태(엽성)
leaf_attitude:
  ipyeop: "입엽"
  suyeop: "수엽"
  nosuyeop: "노수엽"
  gwolyeop: "권엽"

pattern:
  jungtu: "중투"
  ho: "호"
  bokryun: "복륜"
  sanban: "산반"
  sapiban: "사피반"
  hopiban: "호피반"
  seoban: "서반"

leaf_tip:
  wondu: "원두"
  dundu: "둔두"
  yedu: "예두"

pattern_position:
  central: "중앙"
  margin: "가장자리"
  tip: "선단"
  base: "기부"
  full_leaf: "전면"

pattern_timing:
  seoncheon: "선천성"
  hubal: "후발성"
  somyeol: "소멸성"

# --------------------------------------------------
# 시장 정보
# --------------------------------------------------

market_status:
  general: "일반 유통"
  premium: "고가 유통"
  unknown: "확인되지 않음"

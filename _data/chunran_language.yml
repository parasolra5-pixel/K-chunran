# 한국춘란 현장 언어 모델 v1
#
# 원칙:
# - 특정 사이트의 게시글 자체를 저장하지 않는다.
# - 실제 자료에서 확인된 표현과 현재의 해석 상태를 분리한다.
# - 관찰 형질, 현장 형질어, 상태 평가어, 품평어, 개화 전 감정 참고 형질을 분리한다.
# - 예(藝)와 도감 분류를 이 언어 모델과 동일시하지 않는다.
# - 확정되지 않은 표현은 후보로 보존하고, 추후 근거가 쌓이면 승격한다.
#
# confidence:
#   core: 현재 여러 현장 자료에서 반복 확인된 핵심 후보
#   supported: 실제 사용은 확인되었으나 의미·관계의 추가 검증이 필요한 표현
#   candidate: 전문 감상 문맥 등에서 확인 주장되었으나 원문 검증이 더 필요한 표현

observation:
  - id: baegol
    term: "배골"
    confidence: core
    note: "잎 중앙을 따라 형성된 세로 방향의 골을 가리키는 현장 표현. 정확한 식물학적 해부학 용어와 동일시하지 않는다."
  - id: leaf_tip_curl
    term: "옥아지다"
    confidence: core
    note: "잎끝이 잘 모아지거나 오므라진 형태를 표현하는 현장어. 세부 형태 정의는 추가 검증한다."

field_traits:
  - id: huyuk
    term: "후육"
    confidence: core
    note: "잎살이 두껍고 탄탄한 상태를 가리키는 현장 형질어."
  - id: huyukjil
    term: "후육질"
    confidence: core
    note: "후육한 잎의 질감·엽성을 표현하는 현장어."
  - id: ipbyeon
    term: "입변"
    confidence: core
    note: "한국춘란 현장에서 사용되는 잎 형질 축. 단엽·환엽과 별도로 보존하며 정확한 형태학적 정의는 추가 검증한다."
  - id: ipbyeonseong
    term: "입변성"
    confidence: core
    note: "입변의 성향 또는 특성을 나타내는 표현."
  - id: danyeop
    term: "단엽"
    confidence: core
    note: "잎 형태를 나타내는 도감·현장 분류어."
  - id: hwanyeop
    term: "환엽"
    confidence: core
    note: "잎 형태를 나타내는 도감·현장 분류어."
  - id: jungtu
    term: "중투"
    confidence: core
    note: "무늬를 나타내는 현장 형질어."
  - id: bokryun
    term: "복륜"
    confidence: core
    note: "현장 형질어이자 예(藝) 모델에서 독립적으로 다룰 수 있는 표현. 잎과 꽃에서 나타나는 위치를 별도로 기록할 수 있다."
  - id: sanban
    term: "산반"
    confidence: core
    note: "무늬를 나타내는 현장 형질어."
  - id: seoban
    term: "서반"
    confidence: core
    note: "무늬를 나타내는 현장 형질어."
  - id: ho
    term: "호"
    confidence: core
    note: "무늬를 나타내는 현장 형질어."
  - id: sapiban
    term: "사피반"
    confidence: supported
    note: "현장 무늬 표현. 세부 용례는 지속 검증한다."
  - id: hopiban
    term: "호피반"
    confidence: supported
    note: "현장 무늬 표현. 세부 용례는 지속 검증한다."
  - id: yeopseong
    term: "엽성"
    confidence: core
    note: "잎의 형태·질·자태를 종합하여 평가하는 현장 표현."
  - id: dohwa_mok
    term: "두화목"
    confidence: core
    note: "개화 전 두화 성향을 참고하는 현장 표현. 실제 개화한 꽃의 분류와 동일시하지 않는다."
  - id: dohwa_byeon
    term: "두화변"
    confidence: core
    note: "두화 성향과 관련하여 개화 전 또는 잎의 형질을 설명하는 현장 표현. 정확한 관계는 추가 검증한다."

condition_assessment:
  - id: seryeok
    term: "세력이 좋다"
    confidence: core
    note: "전체 생육 상태와 활력이 좋다는 현장 평가 표현."
  - id: chose
    term: "초세가 좋다"
    confidence: supported
    note: "생육의 힘과 상태를 평가하는 현장 표현. 세력과의 세부 차이는 추가 검증한다."
  - id: root_good
    term: "뿌리가 좋다"
    confidence: core
    note: "뿌리 상태가 양호하다는 생육 평가 표현."
  - id: development
    term: "발전성이 있다"
    confidence: supported
    note: "현재 형질이 앞으로 더 드러나거나 발전할 가능성을 평가하는 표현. 미래 예측과 동일시하지 않는다."

appraisal:
  - id: suryeohada
    term: "수려하다"
    confidence: candidate
    note: "전체적인 자태와 선의 아름다움을 표현하는 품평어 후보. 전문 원문 검증 후 확정한다."
  - id: danahada
    term: "단아하다"
    confidence: candidate
    note: "맑고 정돈된 미감을 표현하는 품평어 후보. 전문 원문 검증 후 확정한다."
  - id: cheongahada
    term: "청아하다"
    confidence: candidate
    note: "맑고 깨끗한 인상을 표현하는 품평어 후보. 전문 원문 검증 후 확정한다."
  - id: yureohada
    term: "유려하다"
    confidence: candidate
    note: "선과 곡선의 흐름이 아름다운 인상을 표현하는 품평어 후보. 전문 원문 검증 후 확정한다."
  - id: dangdanghada
    term: "당당하다"
    confidence: candidate
    note: "전체적인 자태 또는 꽃의 방향·형태에서 느껴지는 인상을 표현하는 품평어 후보."

pre_bloom_appraisal:
  - id: dohwa_expectation
    term: "두화목으로 보임"
    confidence: core
    note: "개화 전 감정 참고 표현. 실제 두화로 단정하지 않는다."
  - id: dohwa_quality
    term: "두화 자질이 있어 보임"
    confidence: core
    note: "개화 전 관찰에 근거한 참고 표현. 실제 개화 결과와 분리한다."
  - id: color_expectation
    term: "색화 기대주"
    confidence: supported
    note: "개화 전 색화 가능성을 참고하는 표현. 확정 품종이나 개화 결과를 의미하지 않는다."

generation_principles:
  - "관찰된 사실을 먼저 표현하고 현장 형질어를 그 다음에 사용한다."
  - "품평어는 관찰 근거 없이 단독으로 생성하지 않는다."
  - "개화 전 감정 참고 표현을 실제 개화 결과처럼 단정하지 않는다."
  - "예(藝)와 예품수는 용어 출현 횟수로 계산하지 않는다."
  - "도감 분류와 현장 형질어를 동일한 축으로 취급하지 않는다."
  - "새 용어는 실제 춘란 문맥을 확인한 뒤 추가한다."
